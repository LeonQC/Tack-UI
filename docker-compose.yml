services:
  db:
    image: pgvector/pgvector:pg16-trixie # postgres:16 + the pgvector extension (VECTOR type, hnsw index); trixie = same Debian as postgres:16, so the text sort rules (collation) match
    container_name: taskmanagement_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432" # host:container — 5432 on the host is used by ToDoApp's container
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
